[package]
name = "nyvo"
version = "0.1.0-dev"
edition = "2024"

[features]
gui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true }
rust-embed = "8.11.0"
anyhow = "1.0.102"
open = "5.3.4"
clap = { version = "4.6.1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
