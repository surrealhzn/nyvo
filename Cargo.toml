[package]
name = "gui"
version = "0.1.0-dev"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
rust-embed = "8.11.0"
anyhow = "1.0.102"
open = "5.3.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
